name: behavioral validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  key-items:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizers: ["0", "1"]
    env:
      CC: ${{ matrix.compiler }}
      KFIV_VALIDATION_SANITIZERS: ${{ matrix.sanitizers }}
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare game reset and insertion with independent models
        run: python3 -I -m unittest discover -s validation/tests -v
